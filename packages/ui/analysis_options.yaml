include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - web/**


linter:
  rules:
    - prefer_final_locals
    - avoid_dynamic_calls
    - always_declare_return_types
    - unawaited_futures
