name: lakbay_ui
description: "Tide visual theme shared by the Lakbay Romblon app and admin panel."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Figtree, SIL Open Font License 1.1 (fonts/OFL.txt). Bundled so it works
    # offline. It has no ₱ glyph; that one character comes from the system font.
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
