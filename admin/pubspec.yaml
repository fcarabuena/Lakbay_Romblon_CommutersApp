name: lakbay_admin
description: "Lakbay Romblon admin panel (Flutter web)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  file_picker: ^13.2.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.3
  lakbay_core:
    path: ../packages/core
  lakbay_ui:
    path: ../packages/ui
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
